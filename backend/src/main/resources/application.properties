# ===== Configuration GymBox Backend =====
spring.application.name=gymbox-backend

# ----- Serveur -----
server.port=8088

# ----- Base de donnees (MySQL via XAMPP) -----
spring.datasource.url=jdbc:mysql://localhost:3306/gymbox?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ----- JWT -----
app.jwt.secret=GymBoxSecretKey2026ForJwtTokenSigningMustBeLongEnoughHS256!!
app.jwt.expiration-ms=86400000

# ----- Format JSON joli dans les reponses -----
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Logs -----
logging.level.com.gymbox=INFO