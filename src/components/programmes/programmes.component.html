<app-header></app-header>

<section class="min-h-screen pt-24 pb-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16 animate-fade-in">
      <span class="text-primary font-semibold text-sm tracking-wider uppercase">Programmes</span>
      <h1 class="section-title mt-2">Nos <span class="text-gradient">Programmes</span></h1>
      <p class="section-subtitle">Choisissez le programme qui correspond à vos objectifs</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (p of programmes; track p.title) {
        <div class="card-premium group animate-slide-up">
          <div class="flex items-start justify-between mb-6">
            <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-all">
              <span class="material-icons text-primary text-2xl">{{ p.icon }}</span>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 text-primary">{{ p.level }}</span>
          </div>
          <h3 class="text-xl font-bold text-white mb-2">{{ p.title }}</h3>
          <p class="text-sm text-gray-400 mb-4 leading-relaxed">{{ p.description }}</p>
          <ul class="space-y-2 mb-6">
            @for (f of p.features; track f) {
              <li class="flex items-center gap-2 text-sm text-gray-400">
                <span class="material-icons text-primary text-sm">check_circle</span>
                {{ f }}
              </li>
            }
          </ul>
          <div class="flex items-center justify-between pt-4 border-t border-white/5">
            <div>
              <div class="text-2xl font-extrabold text-gradient">{{ p.price }}</div>
              <div class="text-xs text-gray-500">{{ p.duration }}</div>
            </div>
            <button class="btn-secondary px-5 py-2.5 rounded-xl text-sm font-semibold">
              Détails
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<app-footer></app-footer>
