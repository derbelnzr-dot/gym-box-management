<app-header></app-header>

<section class="min-h-screen pt-24 pb-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
      <div class="animate-fade-in">
        <span class="text-primary font-semibold text-sm tracking-wider uppercase">Contact</span>
        <h1 class="section-title mt-2">Contactez-<span class="text-gradient">nous</span></h1>
        <p class="section-subtitle">Envoyez-nous un message et nous vous répondrons rapidement</p>

        <div class="space-y-6 mt-8">
          <div class="card-premium flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <span class="material-icons text-primary">location_on</span>
            </div>
            <div>
              <h3 class="text-white font-semibold mb-1">Adresse</h3>
              <p class="text-gray-400 text-sm">GymBox Grombalia, Tunisie</p>
            </div>
          </div>
          <div class="card-premium flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <span class="material-icons text-primary">phone</span>
            </div>
            <div>
              <h3 class="text-white font-semibold mb-1">Téléphone</h3>
              <p class="text-gray-400 text-sm">+216 22 000 000</p>
            </div>
          </div>
          <div class="card-premium flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <span class="material-icons text-primary">mail</span>
            </div>
            <div>
              <h3 class="text-white font-semibold mb-1">Email</h3>
              <p class="text-gray-400 text-sm">contact&#64;gymbox.tn</p>
            </div>
          </div>
          <div class="card-premium flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
              <span class="material-icons text-primary">schedule</span>
            </div>
            <div>
              <h3 class="text-white font-semibold mb-1">Horaires</h3>
              <p class="text-gray-400 text-sm">Lun-Ven: 6h-23h | Sam: 8h-22h | Dim: 9h-20h</p>
            </div>
          </div>
        </div>
      </div>

      <div class="animate-slide-up">
        <form (ngSubmit)="onSubmit()" class="glass rounded-2xl p-8 space-y-5 border border-white/5">
          <h2 class="text-xl font-bold text-white mb-2">Envoyer un message</h2>

          <div>
            <input type="text" placeholder="Votre nom" [(ngModel)]="contact.name" name="name" required
                   class="input-premium">
          </div>
          <div>
            <input type="email" placeholder="Votre email" [(ngModel)]="contact.email" name="email" required
                   class="input-premium">
          </div>
          <div>
            <textarea placeholder="Votre message" [(ngModel)]="contact.message" name="message" rows="5" required
                      class="input-premium resize-none"></textarea>
          </div>

          <button type="submit" [disabled]="!contact.name || !contact.email || !contact.message"
                  class="btn-primary w-full flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            @if (submitted) {
              <span class="material-icons">check_circle</span>
              Message envoyé !
            } @else {
              <span class="material-icons">send</span>
              Envoyer
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
